<header class="site-header" role="banner">
  <div class="wrapper">

    <!-- SITE TITLE -->
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
      {{ site.title }}
    </a>

    <!-- NAV -->
    <nav class="site-nav">

      <input type="checkbox" id="nav-trigger" class="nav-trigger" />
      <label for="nav-trigger">
        <span class="menu-icon">☰</span>
      </label>

      <div class="trigger">

        <!-- BLACK65 -->
        <a class="page-link" href="https://sites.google.com/view/theblack65/" target="_blank" rel="noopener noreferrer">
          Black65
        </a>

        <!-- PRODUCTS -->
        <div class="nav-group">
          <a class="page-link nav-label">Products ▾</a>
          <div class="nav-dropdown">
            <a class="{% if page.url == '/cdra-76-pro/' %}active{% endif %}" href="/cdra-76-pro/">
              CDRA 76 Pro
            </a>
            <a class="{% if page.url == '/voltrix/' %}active{% endif %}" href="/voltrix/">
              VolTrix Commercial
            </a>
            <a class="{% if page.url == '/option-trading-simulator/' %}active{% endif %}" href="/option-trading-simulator/">
              Option Trading Simulator
            </a>
          </div>
        </div>

        <!-- ABOUT -->
        <a class="page-link {% if page.url == '/about/' %}active{% endif %}" href="/about/">
          About
        </a>

        <!-- FREE TOOLS -->
        <div class="nav-group">
          <a class="page-link nav-label">Free Tools ▾</a>
          <div class="nav-dropdown">
            <a class="{% if page.url == '/iv-finder/' %}active{% endif %}" href="/iv-finder/">
              IV Finder
            </a>
            <a class="{% if page.url == '/price-finder/' %}active{% endif %}" href="/price-finder/">
              Price Finder
            </a>
          </div>
        </div>

      </div>
    </nav>
  </div>
</header>
<script>
document.querySelectorAll('.nav-group .nav-label, .nav-group > span').forEach(el => {
  el.addEventListener('click', (e) => {
    e.preventDefault();
    el.parentElement.classList.toggle('active');
  });
});
</script>
